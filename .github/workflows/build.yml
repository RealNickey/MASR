name: Package build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      artifact-name:
        required: true
        type: string
      sign-updater:
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} (${{ inputs.target }})
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set runner-local Cargo target
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tauri-target" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: "./src-tauri -> ${{ runner.temp }}/tauri-target"
          key: package-${{ inputs.platform }}-${{ inputs.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libgtk-layer-shell0 libgtk-layer-shell-dev libvulkan-dev glslc \
            spirv-tools fuse libfuse2

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set isolated release version
        if: inputs.version != ''
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: bun scripts/set-build-version.ts "$BUILD_VERSION"

      - name: Install ONNX Runtime (Intel macOS)
        if: inputs.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          ORT_SHA256="590cee05699047b85e4a8115b4cec792073c2972ce78de383356a552a296a9c4"
          curl --fail --location --retry 3 --output ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          test "$(shasum -a 256 ort.tgz | awk '{print $1}')" = "$ORT_SHA256"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          ORT_SHA256="7e8062d5cda514fe3e31d805f9aabd50bed42d331994f66753d2dd697294b976"
          curl --fail --location --retry 3 --output ort.tgz "https://blob.handy.computer/onnxruntime-linux-x86_64-${ORT_VERSION}.tgz"
          test "$(sha256sum ort.tgz | awk '{print $1}')" = "$ORT_SHA256"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-linux-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          for file in "$ORT_DIR"/lib/libonnxruntime.so*; do
            if [ -L "$file" ]; then cp -L "$file" "$file.real" && mv "$file.real" "$file"; fi
          done
          jq --arg so "$ORT_DIR/lib/libonnxruntime.so" \
             --arg so1 "$ORT_DIR/lib/libonnxruntime.so.1" \
             --arg sov "$ORT_DIR/lib/libonnxruntime.so.1.24.2" \
            '.bundle.linux.deb.files["/usr/lib/libonnxruntime.so"] = $so | .bundle.linux.deb.files["/usr/lib/libonnxruntime.so.1"] = $so1 | .bundle.linux.deb.files["/usr/lib/libonnxruntime.so.1.24.2"] = $sov' \
            src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Build unsigned packages
        if: inputs.sign-updater == false
        uses: tauri-apps/tauri-action@v0
        env:
          GGML_NATIVE: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX2: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_FMA: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_F16C: ${{ runner.os != 'macOS' && 'OFF' || '' }}
        with:
          args: ${{ inputs.build-args }}

      - name: Build signed packages
        if: inputs.sign-updater == true
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GGML_NATIVE: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX2: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_FMA: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_F16C: ${{ runner.os != 'macOS' && 'OFF' || '' }}
        with:
          args: ${{ inputs.build-args }}

      - name: Remove libwayland-client from AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGN_UPDATER: ${{ inputs.sign-updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          APPIMAGE_PATH=$(find "$CARGO_TARGET_DIR" -path '*/bundle/appimage/*.AppImage' -type f | head -1)
          test -n "$APPIMAGE_PATH"
          cd "$(dirname "$APPIMAGE_PATH")"
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          chmod +x "$APPIMAGE_NAME"
          "./$APPIMAGE_NAME" --appimage-extract
          find squashfs-root -name 'libwayland-client.so*' -type f -delete
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl --fail --location --retry 3 --output appimagetool-x86_64.AppImage "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          test "$(sha256sum appimagetool-x86_64.AppImage | awk '{print $1}')" = "$APPIMAGETOOL_SHA256"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream squashfs-root "$APPIMAGE_NAME"
          UPDATER_ARCHIVE="${APPIMAGE_PATH}.tar.gz"
          rm -f "$UPDATER_ARCHIVE" "${UPDATER_ARCHIVE}.sig"
          tar -C "$(dirname "$APPIMAGE_PATH")" -czf "$UPDATER_ARCHIVE" "$APPIMAGE_NAME"
          tar -tzf "$UPDATER_ARCHIVE" | grep -Fx "$APPIMAGE_NAME"
          if [ "$SIGN_UPDATER" = "true" ]; then
            bun run tauri signer sign "$UPDATER_ARCHIVE"
          fi
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/bundle/**
          if-no-files-found: error
          retention-days: 14

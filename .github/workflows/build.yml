name: Package build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      artifact-name:
        required: true
        type: string
      sign-updater:
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} (${{ inputs.target }})
    runs-on: ${{ inputs.platform }}
    env:
      # Keep all build output runner-local. This deliberately overrides any
      # developer-specific Cargo configuration without changing local builds.
      CARGO_TARGET_DIR: ${{ runner.temp }}/tauri-target
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          workspaces: "./src-tauri -> ${{ runner.temp }}/tauri-target"
          key: package-${{ inputs.platform }}-${{ inputs.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libgtk-layer-shell0 libgtk-layer-shell-dev libvulkan-dev glslc \
            spirv-tools fuse libfuse2

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Prepare Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk mesa-vulkan-drivers

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set isolated release version
        if: inputs.version != ''
        run: bun scripts/set-build-version.ts "${{ inputs.version }}"

      - name: Install ONNX Runtime (Intel macOS)
        if: inputs.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          curl -L -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          curl -L -o ort.tgz "https://blob.handy.computer/onnxruntime-linux-x86_64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-linux-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          for file in "$ORT_DIR"/lib/libonnxruntime.so*; do
            if [ -L "$file" ]; then cp -L "$file" "$file.real" && mv "$file.real" "$file"; fi
          done
          jq --arg so "$ORT_DIR/lib/libonnxruntime.so" \
             --arg so1 "$ORT_DIR/lib/libonnxruntime.so.1" \
             --arg sov "$ORT_DIR/lib/libonnxruntime.so.1.24.2" \
            '.bundle.linux.deb.files["/usr/lib/libonnxruntime.so"] = $so | .bundle.linux.deb.files["/usr/lib/libonnxruntime.so.1"] = $so1 | .bundle.linux.deb.files["/usr/lib/libonnxruntime.so.1.24.2"] = $sov' \
            src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Build packages
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          GGML_NATIVE: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_AVX2: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_FMA: ${{ runner.os != 'macOS' && 'OFF' || '' }}
          GGML_F16C: ${{ runner.os != 'macOS' && 'OFF' || '' }}
        with:
          args: ${{ inputs.build-args }}

      - name: Remove libwayland-client from AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE_PATH=$(find "$CARGO_TARGET_DIR" -path '*/bundle/appimage/*.AppImage' -type f | head -1)
          test -n "$APPIMAGE_PATH"
          cd "$(dirname "$APPIMAGE_PATH")"
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          chmod +x "$APPIMAGE_NAME"
          "./$APPIMAGE_NAME" --appimage-extract
          find squashfs-root -name 'libwayland-client.so*' -type f -delete
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream squashfs-root "$APPIMAGE_NAME"
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/bundle/**
          if-no-files-found: error
          retention-days: 14

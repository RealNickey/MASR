name: MASR CI

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: masr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      # MASR's beta UI policy is English-only. Locale files remain in the tree,
      # but translation-consistency is intentionally not a release gate.
      - run: bun run build

  windows-beta:
    name: Windows x64 beta gate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Shorten Cargo target directory
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 't'
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Vulkan SDK for Whisper
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: windows-x64
      - uses: ./.github/actions/setup-malayalam-model
      - name: Rust tests
        env:
          ORT_DYLIB_PATH: ${{ env.MASR_ORT_LIB_DIR }}\onnxruntime.dll
        run: |
          $env:PATH = "$env:MASR_ORT_LIB_DIR;$env:PATH"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run
          # Windows loads the executable directory before System32 and PATH.
          # Replace any crate-selected DLL beside the test with the exact
          # staged runtime used by the package, preventing an older system DLL
          # from winning the loader search.
          Get-ChildItem -Path "$env:CARGO_TARGET_DIR\debug" -Filter onnxruntime.dll -Recurse | Remove-Item -Force
          $test = Get-ChildItem -Path "$env:CARGO_TARGET_DIR\debug\deps" -Filter 'thegai_app_lib-*.exe' | Select-Object -First 1
          if (-not $test) { throw 'Unable to locate the compiled Rust test executable' }
          Copy-Item -LiteralPath $env:ORT_DYLIB_PATH -Destination (Join-Path $test.DirectoryName 'onnxruntime.dll') -Force
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbinPath = if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1 }
          $dumpbin = if ($dumpbinPath) { Get-Item $dumpbinPath } else { Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $dumpbin) { throw 'Visual Studio dumpbin.exe is unavailable on the Windows runner' }
          Write-Host "Test binary: $($test.FullName)"
          & $dumpbin.FullName /DEPENDENTS $test.FullName
          Write-Host "ORT runtime: $env:ORT_DYLIB_PATH"
          Get-Item $env:ORT_DYLIB_PATH | Format-List FullName,Length,VersionInfo
          Write-Host "Resolved loader PATH: $env:PATH"
          where.exe onnxruntime.dll
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "Rust test executable failed: $LASTEXITCODE" }
      - name: Malayalam CPU smoke test
        env:
          ORT_DYLIB_PATH: ${{ env.MASR_ORT_LIB_DIR }}\onnxruntime.dll
        run: |
          $env:PATH = "$env:MASR_ORT_LIB_DIR;$env:PATH"
          Get-ChildItem -Path "$env:CARGO_TARGET_DIR\debug" -Filter onnxruntime.dll -Recurse | Remove-Item -Force
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin malayalam_smoke
          $smoke = Join-Path $env:CARGO_TARGET_DIR 'debug\malayalam_smoke.exe'
          if (-not (Test-Path $smoke)) { throw 'Malayalam smoke executable was not produced' }
          Copy-Item -LiteralPath $env:ORT_DYLIB_PATH -Destination (Join-Path (Split-Path $smoke) 'onnxruntime.dll') -Force
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Malayalam smoke executable failed: $LASTEXITCODE" }
      - name: Build Windows beta package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --bundles nsis
      - name: Inspect bundled ONNX Runtime and its loader linkage
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          if (-not (& 7z l $installer.FullName | Select-String -Quiet 'onnxruntime.dll')) { throw 'onnxruntime.dll is missing from the Windows package' }
          $app = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter 'thegai.exe' | Select-Object -First 1
          if (-not $app) { throw 'Packaged application executable was not produced' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbinPath = if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1 }
          $dumpbin = if ($dumpbinPath) { Get-Item $dumpbinPath } else { Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $dumpbin) { throw 'Visual Studio dumpbin.exe is unavailable on the Windows runner' }
          $runtime = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter 'onnxruntime.dll' | Select-Object -First 1
          if (-not $runtime) { throw 'Packaged ONNX Runtime DLL was not materialized' }
          if (-not (& $dumpbin.FullName /DEPENDENTS $runtime.FullName | Select-String -Quiet 'VCRUNTIME|api-ms-win|KERNEL32')) { throw 'ONNX Runtime DLL has no inspectable Windows loader dependencies' }
      - name: Install and smoke the NSIS payload without development loader paths
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'masr-installed'
          & $installer.FullName /S "/D=$install"
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed: $LASTEXITCODE" }
          $app = Get-ChildItem -Path $install -Recurse -Filter 'thegai.exe' | Select-Object -First 1
          if (-not $app) { throw 'NSIS payload does not contain thegai.exe' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbinPath = if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1 }
          $dumpbin = if ($dumpbinPath) { Get-Item $dumpbinPath } else { Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          & $dumpbin.FullName /DEPENDENTS $app.FullName
          $savedPath, $savedOrt = $env:PATH, $env:ORT_DYLIB_PATH
          try {
            $env:ORT_DYLIB_PATH = $null
            $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -ne $env:MASR_ORT_LIB_DIR }) -join ';')
            $process = Start-Process -FilePath $app.FullName -ArgumentList '--start-hidden', '--no-tray' -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Installed app exited early: $($process.ExitCode)" }
            Stop-Process -Id $process.Id -Force
          } finally {
            $env:PATH = $savedPath
            $env:ORT_DYLIB_PATH = $savedOrt
          }

  portable-malayalam-smoke:
    name: ${{ matrix.name }} (reported, not beta-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ort: linux-x64
            ort_dylib: libonnxruntime.so
            bundles: deb,appimage
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            ort: macos-arm64
            ort_dylib: libonnxruntime.1.24.2.dylib
            bundles: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Use a runner-local Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/.ci/cargo-target" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev libvulkan-dev glslc spirv-tools fuse libfuse2 xvfb
          command -v glslc
          command -v spirv-as
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: ${{ matrix.ort }}
      - uses: ./.github/actions/setup-malayalam-model
      - name: Rust tests
        working-directory: src-tauri
        env:
          ORT_DYLIB_PATH: ${{ env.MASR_ORT_LIB_DIR }}/${{ matrix.ort_dylib }}
          LD_LIBRARY_PATH: ${{ env.MASR_ORT_LIB_DIR }}
          DYLD_LIBRARY_PATH: ${{ env.MASR_ORT_LIB_DIR }}
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Malayalam CPU smoke test
        env:
          ORT_DYLIB_PATH: ${{ env.MASR_ORT_LIB_DIR }}/${{ matrix.ort_dylib }}
          LD_LIBRARY_PATH: ${{ env.MASR_ORT_LIB_DIR }}
          DYLD_LIBRARY_PATH: ${{ env.MASR_ORT_LIB_DIR }}
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --bin malayalam_smoke
      - name: Build package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Inspect Linux package and linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find "$CARGO_TARGET_DIR" -name '*.deb' -print -quit)"
          appimage="$(find "$CARGO_TARGET_DIR" -name '*.AppImage' -print -quit)"
          test -n "$deb" && test -n "$appimage"
          package_root="$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$deb" "$package_root"
          runtime="$(find "$package_root" -name 'libonnxruntime.so*' -type f -print -quit)"
          test -n "$runtime"
          ldd "$runtime" | grep -q 'libc\.so'
          app="$(find "$package_root" -type f -name thegai -perm -111 -print -quit)"
          test -n "$app"
          ldd "$app"
          set +e
          timeout 15s xvfb-run -a env -u LD_LIBRARY_PATH -u ORT_DYLIB_PATH "$app" --start-hidden --no-tray
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124
          chmod +x "$appimage"
          appimage_extract="$RUNNER_TEMP/appimage-extract"
          mkdir -p "$appimage_extract"
          pushd "$appimage_extract"
          "$appimage" --appimage-extract >/dev/null
          popd
          appimage_root="$appimage_extract/squashfs-root"
          appimage_runtime="$(find "$appimage_root" -name 'libonnxruntime.so*' -type f -print -quit)"
          test -n "$appimage_runtime"
          ldd "$appimage_runtime" | grep -q 'libc\.so'
          appimage_app="$(find "$appimage_root" -type f -name thegai -perm -111 -print -quit)"
          test -n "$appimage_app"
          ldd "$appimage_app"
      - name: Inspect macOS framework and linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$CARGO_TARGET_DIR" -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -f "$app/Contents/Frameworks/libonnxruntime.1.24.2.dylib"
          otool -L "$app/Contents/Frameworks/libonnxruntime.1.24.2.dylib" | grep -q '/usr/lib/libSystem.B.dylib'
          executable="$app/Contents/MacOS/thegai"
          test -x "$executable"
          otool -L "$executable"
          set +e
          python3 - "$executable" <<'PY'
          import os, subprocess, sys
          environment = os.environ.copy()
          environment.pop("DYLD_LIBRARY_PATH", None)
          environment.pop("ORT_DYLIB_PATH", None)
          process = subprocess.Popen([sys.argv[1], "--start-hidden", "--no-tray"], env=environment)
          try:
              sys.exit(process.wait(timeout=15))
          except subprocess.TimeoutExpired:
              process.terminate()
              process.wait(timeout=5)
              sys.exit(124)
          PY
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124

  promotion-policy:
    name: dev to main promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the dev branch and one coordinated patch version
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          test "$HEAD_REF" = 'dev'
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const base = process.env.BASE_REF;
          const fromBase = (path) => execFileSync('git', ['show', `origin/${base}:${path}`], { encoding: 'utf8' });
          const current = [
            JSON.parse(fs.readFileSync('package.json', 'utf8')).version,
            /^version\s*=\s*"([^"]+)"/m.exec(fs.readFileSync('src-tauri/Cargo.toml', 'utf8'))?.[1],
            JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version,
          ];
          const previous = [
            JSON.parse(fromBase('package.json')).version,
            /^version\s*=\s*"([^"]+)"/m.exec(fromBase('src-tauri/Cargo.toml'))?.[1],
            JSON.parse(fromBase('src-tauri/tauri.conf.json')).version,
          ];
          if (current.some((version) => !version) || new Set(current).size !== 1) throw new Error(`Manifest versions must match: ${current.join(', ')}`);
          const patch = (value) => value.match(/^(\d+)\.(\d+)\.(\d+)$/)?.map(Number);
          const [major, minor, patchVersion] = patch(current[0]) ?? [];
          const [oldMajor, oldMinor, oldPatch] = patch(previous[0]) ?? [];
          if (major !== oldMajor || minor !== oldMinor || patchVersion !== oldPatch + 1) {
            throw new Error(`Promotion must make exactly one patch bump: ${previous[0]} -> ${current[0]}`);
          }
          NODE

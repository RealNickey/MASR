name: MASR CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: masr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      # MASR's beta UI policy is English-only. Locale files remain in the tree,
      # but translation-consistency is intentionally not a release gate.
      - run: bun run build

  windows-beta:
    name: Windows x64 beta gate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Shorten Cargo target directory
        shell: pwsh
        run: |
          $target = "$(Split-Path -Qualifier $env:GITHUB_WORKSPACE)\t"
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Vulkan SDK for Whisper
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: windows-x64
      - uses: ./.github/actions/setup-malayalam-model
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Malayalam CPU smoke test
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --bin malayalam_smoke
      - name: Build Windows beta package
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --bundles nsis
      - name: Inspect bundled ONNX Runtime and linkage
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          if (-not (& 7z l $installer.FullName | Select-String -Quiet 'onnxruntime.dll')) { throw 'onnxruntime.dll is missing from the Windows package' }
          $app = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter 'thegai.exe' | Select-Object -First 1
          if (-not $app) { throw 'Packaged application executable was not produced' }
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dumpbin.exe is unavailable on the Windows runner' }
          if (-not (& $dumpbin.FullName /DEPENDENTS $app.FullName | Select-String -Quiet 'onnxruntime.dll')) { throw 'Windows application is not linked to onnxruntime.dll' }

  portable-malayalam-smoke:
    name: ${{ matrix.name }} (reported, not beta-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ort: linux-x64
            bundles: deb,appimage
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            ort: macos-arm64
            bundles: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev fuse libfuse2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: ${{ matrix.ort }}
      - uses: ./.github/actions/setup-malayalam-model
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Malayalam CPU smoke test
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --bin malayalam_smoke
      - name: Build package
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Inspect Linux package and linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target -name '*.deb' -print -quit)"
          appimage="$(find src-tauri/target -name '*.AppImage' -print -quit)"
          test -n "$deb" && test -n "$appimage"
          dpkg-deb -c "$deb" | grep -q 'libonnxruntime.so'
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -n "$(find squashfs-root -name 'libonnxruntime.so*' -type f -print -quit)"
          binary="$(find squashfs-root -path '*/usr/bin/thegai' -type f -print -quit)"
          readelf -d "$binary" | grep -q 'onnxruntime'
      - name: Inspect macOS framework and linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -f "$app/Contents/Frameworks/libonnxruntime.1.24.2.dylib"
          otool -L "$app/Contents/MacOS/thegai" | grep -q 'libonnxruntime'

  promotion-policy:
    name: dev to main promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the dev branch and one coordinated patch version
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          test "$HEAD_REF" = 'dev'
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const base = process.env.BASE_REF;
          const fromBase = (path) => execFileSync('git', ['show', `origin/${base}:${path}`], { encoding: 'utf8' });
          const current = [
            JSON.parse(fs.readFileSync('package.json', 'utf8')).version,
            /^version\s*=\s*"([^"]+)"/m.exec(fs.readFileSync('src-tauri/Cargo.toml', 'utf8'))?.[1],
            JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version,
          ];
          const previous = [
            JSON.parse(fromBase('package.json')).version,
            /^version\s*=\s*"([^"]+)"/m.exec(fromBase('src-tauri/Cargo.toml'))?.[1],
            JSON.parse(fromBase('src-tauri/tauri.conf.json')).version,
          ];
          if (current.some((version) => !version) || new Set(current).size !== 1) throw new Error(`Manifest versions must match: ${current.join(', ')}`);
          const patch = (value) => value.match(/^(\d+)\.(\d+)\.(\d+)$/)?.map(Number);
          const [major, minor, patchVersion] = patch(current[0]) ?? [];
          const [oldMajor, oldMinor, oldPatch] = patch(previous[0]) ?? [];
          if (major !== oldMajor || minor !== oldMinor || patchVersion !== oldPatch + 1) {
            throw new Error(`Promotion must make exactly one patch bump: ${previous[0]} -> ${current[0]}`);
          }
          NODE

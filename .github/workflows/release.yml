name: Publish MASR release from main

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/ci-cd/**"
      - "docs/github-actions/**"
      - "CI_CD.md"
  workflow_dispatch:

concurrency:
  group: masr-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release version
    if: >-
      github.repository == 'RealNickey/MASR' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$version" = "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }} package and payload smoke
    if: >-
      github.repository == 'RealNickey/MASR' &&
      github.ref == 'refs/heads/main'
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ort: windows-x64
            runtime: onnxruntime.dll
            bundles: nsis
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ort: linux-x64
            runtime: libonnxruntime.so
            bundles: deb,appimage
            artifact: linux-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            ort: macos-arm64
            runtime: libonnxruntime.1.24.2.dylib
            bundles: dmg,app
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Use a short Windows Cargo target directory
        shell: pwsh
        run: |
          # whisper.cpp's generated Vulkan build tree is deeply nested. The
          # Windows FileTracker cannot create its logs once whisper.cpp's
          # generated Vulkan tree extends a runner-temp path. Map its target
          # through T: so the generated tree starts at T:\ on hosted runners.
          if ($env:RUNNER_OS -eq 'Windows') {
            New-Item -ItemType Directory -Path 'D:\t' -Force | Out-Null
            subst T: D:\t
            $target = 'T:\'
          } else {
            $target = Join-Path $env:RUNNER_TEMP 'cargo-target'
          }
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Windows Vulkan tooling
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install Linux dependencies and Vulkan compiler
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev libvulkan-dev glslc spirv-tools fuse libfuse2 xvfb
          command -v glslc
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: ${{ matrix.ort }}
      - uses: ./.github/actions/setup-malayalam-model
      - name: Require Tauri updater signing material
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required' }
      - name: Build updater artifacts
        env:
          ORT_DYLIB_PATH: ${{ runner.os == 'Windows' && format('{0}\\{1}', env.MASR_ORT_LIB_DIR, matrix.runtime) || format('{0}/{1}', env.MASR_ORT_LIB_DIR, matrix.runtime) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        shell: bash
        run: |
          export PATH="$MASR_ORT_LIB_DIR:$PATH"
          bun run tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Verify Windows installed NSIS payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $signature = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe.sig' | Select-Object -First 1
          if (-not $installer -or -not $signature) { throw 'Signed NSIS updater artifact is missing' }
          $install = Join-Path $env:RUNNER_TEMP 'installed'
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS install failed: $($installerProcess.ExitCode)" }
          $app = Get-ChildItem -Path $install -Recurse -Filter thegai.exe | Select-Object -First 1
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbinPath = if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1 }
          $dumpbin = if ($dumpbinPath) { Get-Item $dumpbinPath } else { Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $app -or -not $dumpbin) { throw 'Installed executable or dumpbin is missing' }
          & $dumpbin.FullName /DEPENDENTS $app.FullName
          $env:ORT_DYLIB_PATH = $null
          $process = Start-Process $app.FullName -ArgumentList '--start-hidden', '--no-tray' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Installed application exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Verify Linux installable payloads
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb="$(find "$CARGO_TARGET_DIR" -name '*.deb' -print -quit)"; appimage="$(find "$CARGO_TARGET_DIR" -name '*.AppImage' -print -quit)"
          test -n "$deb" && test -n "$appimage"
          root="$RUNNER_TEMP/deb-root"; dpkg-deb -x "$deb" "$root"
          runtime="$(find "$root" -name 'libonnxruntime.so*' -type f -print -quit)"; app="$(find "$root" -name thegai -type f -perm -111 -print -quit)"
          test -n "$runtime" && test -n "$app"; ldd "$app"
          set +e; timeout 15s xvfb-run -a env -u LD_LIBRARY_PATH -u ORT_DYLIB_PATH "$app" --start-hidden --no-tray; status=$?; set -e
          test "$status" -eq 0 -o "$status" -eq 124
          mkdir "$RUNNER_TEMP/appimage"; (cd "$RUNNER_TEMP/appimage" && "$appimage" --appimage-extract >/dev/null)
          find "$RUNNER_TEMP/appimage/squashfs-root" -name 'libonnxruntime.so*' -type f -print -quit | grep -q .
      - name: Verify macOS app payload
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="$(find "$CARGO_TARGET_DIR" -name '*.app' -type d -print -quit)"; test -n "$app"
          executable="$app/Contents/MacOS/thegai"
          test -x "$executable"; test -f "$app/Contents/Frameworks/${{ matrix.runtime }}"
          otool -L "$executable"; otool -L "$app/Contents/Frameworks/${{ matrix.runtime }}"
          set +e
          python3 - "$executable" <<'PY'
          import os, subprocess, sys
          environment = os.environ.copy()
          environment.pop("DYLD_LIBRARY_PATH", None)
          environment.pop("ORT_DYLIB_PATH", None)
          process = subprocess.Popen([sys.argv[1], "--start-hidden", "--no-tray"], env=environment)
          try:
              sys.exit(process.wait(timeout=15))
          except subprocess.TimeoutExpired:
              process.terminate()
              process.wait(timeout=5)
              sys.exit(124)
          PY
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124
      - name: Collect signed package artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "$CARGO_TARGET_DIR" -type f \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.dmg' -o -name '*.dmg.sig' -o -name '*.tar.gz' -o -name '*.tar.gz.sig' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -gt 0
          (cd release-assets && shasum -a 256 * > "SHA256SUMS-${{ matrix.artifact }}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.metadata.outputs.version }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified three-platform release
    needs: [metadata, package]
    if: >-
      needs.package.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Require publishing credentials without exposing values
        env:
          RUNTIME_DEPOT_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for secret in RUNTIME_DEPOT_TOKEN TAURI_SIGNING_PRIVATE_KEY; do test -n "${!secret}"; done
      - name: Require a new runtime-depot release version
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo RealNickey/runtime-depot >/dev/null 2>&1; then
            echo "v$VERSION is already published; bump the patch version before releasing main again." >&2
            exit 1
          fi
      - name: Create platform-aware updater manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          const files = fs.readdirSync('release-assets');
          const entry = (pattern, platform) => { const asset = files.find((name) => pattern.test(name)); const sig = asset && `${asset}.sig`; if (!asset || !files.includes(sig)) throw new Error(`Missing signed ${platform} updater artifact`); return [platform, { signature: fs.readFileSync(path.join('release-assets', sig), 'utf8').trim(), url: `https://github.com/RealNickey/runtime-depot/releases/download/v${process.env.VERSION}/${encodeURIComponent(asset)}` }]; };
          const platforms = Object.fromEntries([entry(/-setup\.exe$/i, 'windows-x86_64'), entry(/AppImage.*\.tar\.gz$/i, 'linux-x86_64'), entry(/\.app\.tar\.gz$/i, 'darwin-aarch64')]);
          fs.writeFileSync('release-assets/latest.json', JSON.stringify({ version: process.env.VERSION, notes: `MASR ${process.env.VERSION}`, pub_date: new Date().toISOString(), platforms }, null, 2) + '\n');
          NODE
      - name: Create GitHub Release only after all payload checks
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: gh release create "v$VERSION" release-assets/* --repo RealNickey/runtime-depot --title "v$VERSION" --generate-notes

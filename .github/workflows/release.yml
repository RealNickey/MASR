name: Publish Windows beta

# A release is only created by merging the reviewed dev -> main promotion PR.
# Direct pushes to main deliberately cannot reach a signing or publishing job.
on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: windows-beta-release-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-windows:
    name: Build and sign Windows x64 beta
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.repository == 'RealNickey/MASR'
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Read coordinated source version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (($package.version -ne $cargo) -or ($package.version -ne $tauri)) { throw 'Release manifests do not agree on one version' }
          "value=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Shorten Cargo target directory
        shell: pwsh
        run: |
          $target = "$(Split-Path -Qualifier $env:GITHUB_WORKSPACE)\t"
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-ort-runtime
        with:
          target: windows-x64
      - uses: ./.github/actions/setup-malayalam-model
      - name: Verify the exact source with Malayalam smoke
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --bin malayalam_smoke
      - name: Build signed Windows updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --bundles nsis
      - name: Stage exactly one Windows updater asset
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $installer = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $signature = Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*-setup.exe.sig' | Select-Object -First 1
          if (-not $installer -or -not $signature) { throw 'Signed NSIS updater artifact was not produced' }
          Copy-Item -LiteralPath $installer.FullName -Destination $stage
          Copy-Item -LiteralPath $signature.FullName -Destination $stage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Windows-only updater manifest
    needs: release-windows
    if: needs.release-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-beta-${{ needs.release-windows.outputs.version }}
          path: release-assets
      - name: Create Windows-only latest.json
        env:
          VERSION: ${{ needs.release-windows.outputs.version }}
        run: |
          set -euo pipefail
          installer="$(find release-assets -name '*-setup.exe' -print -quit)"
          signature="${installer}.sig"
          test -f "$installer" && test -f "$signature"
          name="$(basename "$installer")"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const installer = fs.readdirSync('release-assets').find((file) => /-setup\.exe$/i.test(file));
          const signature = fs.readFileSync(path.join('release-assets', `${installer}.sig`), 'utf8').trim();
          fs.writeFileSync('release-assets/latest.json', JSON.stringify({
            version: process.env.VERSION,
            notes: `MASR Windows beta ${process.env.VERSION}`,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature,
                url: `https://github.com/RealNickey/runtime-depot/releases/download/v${process.env.VERSION}/${encodeURIComponent(installer)}`,
              },
            },
          }, null, 2) + '\n');
          NODE
      - name: Publish only to RealNickey runtime depot
        env:
          # The repository owner must provision this token with contents-only
          # access to RealNickey/runtime-depot; it is never exposed to CI jobs.
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
          VERSION: ${{ needs.release-windows.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tag="v$VERSION"
          if gh release view "$tag" --repo RealNickey/runtime-depot >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo RealNickey/runtime-depot
          else
            gh release create "$tag" release-assets/* --title "$tag" --generate-notes --latest --repo RealNickey/runtime-depot
          fi

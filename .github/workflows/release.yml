name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-runtime-depot
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
        run: |
          latest=$(gh api repos/RealNickey/runtime-depot/releases/latest --jq .tag_name)
          case "$latest" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid latest release tag: $latest"; exit 1;; esac
          base=${latest#v}
          IFS=. read -r major minor patch <<< "$base"
          echo "value=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      version: ${{ needs.prepare.outputs.version }}
      artifact-name: release-${{ matrix.target }}
      sign-updater: true
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: false

      - name: Create draft release and upload packages
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo RealNickey/runtime-depot --title "v$VERSION" --generate-notes --draft
          find artifacts -type f -print0 | xargs -0 gh release upload "v$VERSION" --repo RealNickey/runtime-depot

      - name: Generate and upload updater manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.RUNTIME_DEPOT_TOKEN }}
        run: |
          bun scripts/generate-latest-json.ts "$VERSION" artifacts latest.json
          gh release upload "v$VERSION" latest.json --repo RealNickey/runtime-depot
          gh release edit "v$VERSION" --repo RealNickey/runtime-depot --draft=false
